# AlexKBR MK-X - SO focado em jogos (Fedora Atomic + XFCE com visual estilo XP)
name: alexkbr-mk-x
description: AlexKBR MK-X - sistema leve para jogos, GPU AMD, visual inspirado no Windows XP
base-image: ghcr.io/ublue-os/base-main
image-version: latest   # depois fixe na versao estavel atual do Fedora

modules:
  # 1) Pacotes do sistema (so o essencial; os jogos vem por Flatpak)
  - type: rpm-ostree
    install:
      # Desktop leve (XFCE) + menu iniciar estilo classico
      - xorg-x11-server-Xorg
      - xorg-x11-xinit
      - xorg-x11-drv-libinput
      - lightdm
      - lightdm-gtk
      - xfce4-session
      - xfce4-panel
      - xfce4-settings
      - xfce4-appfinder
      - xfce4-power-manager
      - xfce4-notifyd
      - xfce4-taskmanager
      - xfce4-terminal
      - xfce4-pulseaudio-plugin
      - xfce4-whiskermenu-plugin
      - xfwm4
      - xfdesktop
      - Thunar
      - thunar-volman
      - gvfs
      - mousepad
      - ristretto
      - file-roller
      - network-manager-applet
      - pavucontrol
      - xdg-user-dirs-gtk
      - git
      # Ferramentas de jogos e desempenho
      - gamescope
      - gamemode
      - mangohud
      - corectrl
      - tuned
      - tuned-ppd

  # 2) Nossos arquivos de configuracao (sysctl, udev, tuned, gamemode, pipewire...)
  - type: files
    files:
      - source: system
        destination: /

  # 3) Tema estilo XP (baixado na build)
  - type: script
    scripts:
      - xp-theme.sh
      - create-test-user.sh
      - xfce-windows-style.sh

  # 4) Servicos
  - type: systemd
    system:
      enabled:
        - lightdm.service
        - tuned.service

  # 5) Jogos e apps via Flatpak (instalados no primeiro boot, com internet)
  - type: default-flatpaks
    configurations:
      - scope: system
        repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
        repo-name: flathub
        install:
          - com.valvesoftware.Steam
          - net.lutris.Lutris
          - com.heroicgameslauncher.hgl
          - net.davidotek.pupgui2
          - com.usebottles.bottles
          - org.mozilla.firefox
